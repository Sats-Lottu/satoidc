[project]
name = "satoidc"
version = "0.1.0"
description = "OpenID Connect provider with Bitcoin/Lightning LNURL-auth support."
authors = [
    {name = "Lucas Santos Silva", email = "luss1010@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard] (>=0.129.0,<0.130.0)",
    "authlib (>=1.6.8,<2.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "psycopg[binary] (>=3.3.2,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.0.46,<3.0.0)",
    "ecdsa (>=0.19.1,<0.20.0)",
    "bech32 (>=1.2.0,<2.0.0)",
    "pydantic-settings (>=2.13.0,<3.0.0)",
    "nicegui (>=3.7.1,<4.0.0)",
    "segno (>=1.6.6,<2.0.0)",
    "aiosmtplib (>=5.1.0,<6.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[dependency-groups]
dev = [
    "taskipy (>=1.14.1,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "testcontainers (>=4.14.2,<5.0.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "ruff (>=0.15.11,<0.16.0)",
    "typos (>=1.45.1,<2.0.0)",
    "pytest-playwright-asyncio (>=0.7.2,<0.8.0)",
    "locust (>=2.44.0,<3.0.0)",
    "hypothesis (>=6.152.7,<7.0.0)",
    "tavern (>=3.4.0,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-p nicegui.testing.user_plugin -s -x --cov=satoidc -vv"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
main_file = "satoidc/main.py"
markers = [
    "e2e: end-to-end browser tests",
    "setup: setup wizard focused tests",
    "integration: tests that require Docker, Testcontainers, or external services",
    "container: Testcontainers-backed integration tests",
    "property: Hypothesis property-based tests with bounded runtime",
    "property_slow: slower property tests excluded from the property smoke task",
    "api_security: API security regression tests",
    "api_contract: broader API contract tests",
    "load: load or performance smoke tests",
    "slow: tests too expensive for the default local suite",
]
filterwarnings = [
]

[tool.coverage.run]
core = "ctrace"
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 79
extend-exclude = [
    "migrations",
]

[tool.ruff.lint]
preview = true
select = [
    "I",
    "F",
    "E",
    "W",
    "PL",
    "PT",
    "FAST",
]

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.taskipy.tasks]
run = "fastapi dev satoidc/main.py"
setup_wizard = "python -m setup_wizard"
test = "pytest -m \"not e2e and not integration and not container and not property and not load and not slow\""
test_unit = "pytest -m \"not e2e and not integration and not container and not property and not load and not slow\""
test_property = "pytest -m \"property and not property_slow\" --no-cov"
test_api_security = "pytest -m api_security tests/api --no-cov"
test_integration = "pytest -m \"(integration or container) and not load\" --no-cov"
test_load = "locust -f tests/load/locustfile.py --headless --users 5 --spawn-rate 1 --run-time 1m --host http://127.0.0.1:8000"
test_load_ui = "locust -f tests/load/locustfile.py --host http://127.0.0.1:8000"
test_all = "pytest -m \"not load and not slow\""
test_setup = "pytest -m setup tests/setup"
test_e2e = "pytest -m e2e tests/e2e"
lint = "ruff check"
spellcheck = "typos --config pyproject.toml --force-exclude ."
format = "ruff format"
pre_format = "ruff check --fix"
playwright_install = "playwright install chromium"
start_public_client = "python ../examples/public_client.py --client-id"
coverage_html = "coverage html"
post_test = "coverage html"
