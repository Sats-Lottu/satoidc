---
test_name: Public metadata and route boundary contracts

marks:
  - api_security
  - usefixtures:
      - api_base_url

stages:
  - name: Discovery metadata is public JSON
    request:
      url: "{api_base_url}/.well-known/openid-configuration"
      method: GET
    response:
      strict: false
      status_code: 200
      headers:
        content-type: application/json
      json:
        issuer: "http://localhost:8000"
        token_endpoint: "http://localhost:8000/oauth/token"
        jwks_uri: "http://localhost:8000/.well-known/jwks.json"

  - name: JWKS exposes public keys
    request:
      url: "{api_base_url}/.well-known/jwks.json"
      method: GET
    response:
      status_code: 200
      headers:
        content-type: application/json

  - name: OAuth lookalike route is protected
    request:
      url: "{api_base_url}/oauth-settings"
      method: GET
      follow_redirects: false
    response:
      status_code: 303
      headers:
        location: "/login?redirect_to=%2Foauth-settings"

  - name: API lookalike route is protected
    request:
      url: "{api_base_url}/api-admin"
      method: GET
      follow_redirects: false
    response:
      status_code: 303
      headers:
        location: "/login?redirect_to=%2Fapi-admin"
