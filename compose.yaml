services:
  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  satoidc:
    build:
      context: .
      dockerfile: satoidc/DockerFile
    restart: unless-stopped
    entrypoint: [ "sh", "/app/entrypoint.sh" ]
    ports:
      - "${SATOIDC_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - generated-secrets:/app/generated
    environment:
      APP_ENV: ${APP_ENV:-development}
      DOMAIN: ${DOMAIN:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@database:5432/${POSTGRES_DB:-app_db}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@database:5432/${POSTGRES_DB:-app_db}
      OAUTH2_JWT_ISS: ${OAUTH2_JWT_ISS:-http://localhost:8000}
      OAUTH2_JWT_SECRET_KEY: ${OAUTH2_JWT_SECRET_KEY:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET}
      OAUTH2_TOKEN_EXPIRES_IN: ${OAUTH2_TOKEN_EXPIRES_IN:-300}
      OIDC_SIGNING_BACKEND: ${OIDC_SIGNING_BACKEND:-database}
      SESSION_MIDDLEWARE_SECRET_KEY: ${SESSION_MIDDLEWARE_SECRET_KEY:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET}
      SESSION_COOKIE_HTTPS_ONLY: ${SESSION_COOKIE_HTTPS_ONLY:-false}
      SETUP_GENERATED_SECRETS_PATH: ${SETUP_GENERATED_SECRETS_PATH:-/app/generated/secrets.env}

volumes:
  pgdata:
  generated-secrets:
