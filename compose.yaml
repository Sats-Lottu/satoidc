services:
  database:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: app_user
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD: app_password
    expose:
      - 5432

  satoidc:
    build:
      context: .
      dockerfile: satoidc/DockerFile
    entrypoint: [ "sh", "/app/entrypoint.sh" ]
    ports:
      - "8000:8000"
    depends_on:
      - database
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@database:5432/app_db
      SYNC_DATABASE_URL: postgresql+psycopg://app_user:app_password@database:5432/app_db

volumes:
  pgdata:
