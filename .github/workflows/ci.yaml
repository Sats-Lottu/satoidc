name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: satoidc

    env:
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:///satoidc.db
      SYNC_DATABASE_URL: sqlite:///satoidc.db
      OAUTH2_JWT_ISS: http://localhost:8000
      OAUTH2_JWT_SECRET_KEY: ci-only-secret
      SESSION_MIDDLEWARE_SECRET_KEY: ci-only-secret
      SESSION_COOKIE_HTTPS_ONLY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run lint
        run: poetry run task lint

      - name: Run tests
        run: poetry run task test

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build image
        run: docker compose build satoidc
